<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dish Scanner</title>
    <!-- React & Tailwind CDN & Axios & FontAwesome -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function DishScannerApp() {
            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [estimatedWeight, setEstimatedWeight] = useState(300);
            const [isLoading, setIsLoading] = useState(false);
            const [scanResult, setScanResult] = useState(null);
            const [isSaved, setIsSaved] = useState(false);
            const [errorMessage, setErrorMessage] = useState("");

            // 1. اختيار المعاينة والصورة
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setSelectedFile(file);
                    setPreviewUrl(URL.createObjectURL(file));
                    setScanResult(null);
                    setIsSaved(false);
                    setErrorMessage("");
                }
            };

            // 2. إرسال الصورة والوزن لـ Node.js Backend (:5000)
            const handleScanDish = async () => {
                if (!selectedFile) {
                    alert("يرجى اختيار صورة للوجبة أولاً!");
                    return;
                }

                setIsLoading(true);
                setErrorMessage("");
                setIsSaved(false);

                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('estimated_weight_g', estimatedWeight);

                try {
                    // الربط المباشر مع Node.js Backend
                    const response = await axios.post('http://localhost:5000/api/scan-dish', formData, {
                        headers: {
                            'Content-Type': 'multipart/form-data'
                        }
                    });

                    if (response.data && response.data.items) {
                        setScanResult(response.data.items);
                    } else {
                        setErrorMessage("لم يتم استلام نتائج صحيحة من السيرفر.");
                    }
                } catch (error) {
                    console.error("خطأ أثناء الفحص:", error);
                    setErrorMessage("تعذر الاتصال بالباك إند! تأكد أن Node.js و Python شغالين.");
                } finally {
                    setIsLoading(false);
                }
            };

            // 3. تعديل الوزن التقديري لكل عنصر (User Confirmation UI Requirement)
            const handleWeightChange = (index, newWeight) => {
                const updatedItems = [...scanResult];
                updatedItems[index].weight_g = Math.max(0, Number(newWeight));
                setScanResult(updatedItems);
            };

            // 4. حذف عنصر
            const handleRemoveItem = (index) => {
                const updatedItems = scanResult.filter((_, i) => i !== index);
                setScanResult(updatedItems);
            };

            // 5. حساب إجمالي السعرات والماكروز بعد تعديل المستخدم
            const calculateTotals = () => {
                if (!scanResult) return { cal: 0, protein: 0, carbs: 0, fat: 0 };
                return scanResult.reduce((acc, item) => {
                    const factor = item.weight_g / 100;
                    return {
                        cal: acc.cal + ((item.calories / (item.weight_g || 1)) * 100) * factor,
                        protein: acc.protein + item.protein_g,
                        carbs: acc.carbs + item.carbs_g,
                        fat: acc.fat + item.fat_g,
                    };
                }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
            };

            const totals = calculateTotals();

            return (
                <div className="w-full max-w-2xl bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-700 p-6">
                    <h1 className="text-2xl font-bold text-center text-emerald-400 mb-6">
                        <i className="fa-solid fa-utensils ml-2"></i>
                        AI Dish Scanner
                    </h1>

                    {/* قسم إدخال الصورة والوزن */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div className="flex flex-col items-center justify-center border-2 border-dashed border-gray-600 rounded-xl p-4 bg-gray-900/50">
                            {previewUrl ? (
                                <img src={previewUrl} alt="Dish" className="w-full h-48 object-cover rounded-lg mb-3" />
                            ) : (
                                <div className="text-center text-gray-400 py-8">
                                    <i className="fa-solid fa-cloud-arrow-up text-4xl mb-2 text-emerald-500"></i>
                                    <p className="text-sm">اختر أو التقط صورة للوجبة</p>
                                </div>
                            )}
                            <input 
                                type="file" 
                                accept="image/*" 
                                onChange={handleImageChange}
                                className="text-xs text-gray-400 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer w-full"
                            />
                        </div>

                        <div className="flex flex-col justify-between">
                            <div>
                                <label className="block text-sm font-medium text-gray-300 mb-2">
                                    الوزن التقديري للطبق (جرام):
                                </label>
                                <input 
                                    type="number" 
                                    value={estimatedWeight}
                                    onChange={(e) => setEstimatedWeight(Number(e.target.value))}
                                    className="w-full bg-gray-700 text-white border border-gray-600 rounded-lg p-2.5 mb-4 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                />
                                <p className="text-xs text-gray-400 leading-relaxed">
                                    * سيتم إرسال الصورة لـ Node.js ثم تحويلها لـ Python AI لمعرفة المكونات وحساب السعرات.
                                </p>
                            </div>

                            <button 
                                onClick={handleScanDish}
                                disabled={isLoading}
                                className="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 disabled:opacity-50"
                            >
                                {isLoading ? (
                                    <>
                                        <i className="fa-solid fa-spinner fa-spin"></i>
                                        جاري الفحص من خلال الباك إند...
                                    </>
                                ) : (
                                    <>
                                        <i className="fa-solid fa-wand-magic-sparkles"></i>
                                        فحص الوجبة الآن
                                    </>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* رسائل الخطأ لو في مشكلة في السيرفرات */}
                    {errorMessage && (
                        <div className="p-3 bg-red-500/20 text-red-300 rounded-lg text-center text-sm border border-red-500/40 mb-6">
                            ⚠️ {errorMessage}
                        </div>
                    )}

                    {/* شاشة التأكيد والتعديل للمستخدم (Confirmation UI) */}
                    {scanResult && (
                        <div className="border-t border-gray-700 pt-6 animate-fade-in">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-emerald-400">
                                    <i className="fa-solid fa-check-circle ml-2"></i>
                                    تأكيد المكونات والجرامات (Confirmation)
                                </h2>
                                <span className="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full border border-amber-500/30">
                                    يمكنك التعديل قبل الحفظ
                                </span>
                            </div>

                            <div className="space-y-3 mb-6">
                                {scanResult.map((item, idx) => (
                                    <div key={idx} className="flex items-center justify-between bg-gray-900 p-3 rounded-lg border border-gray-700">
                                        <span className="font-semibold text-gray-200 w-1/3">{item.name_ar}</span>
                                        
                                        <div className="flex items-center gap-2">
                                            <input 
                                                type="number" 
                                                value={item.weight_g}
                                                onChange={(e) => handleWeightChange(idx, e.target.value)}
                                                className="w-20 bg-gray-800 text-center text-white border border-gray-600 rounded p-1 text-sm focus:border-emerald-500 focus:outline-none"
                                            />
                                            <span className="text-xs text-gray-400">جم</span>
                                        </div>

                                        <span className="text-sm font-bold text-emerald-400 w-20 text-left">
                                            {item.calories} cal
                                        </span>

                                        <button 
                                            onClick={() => handleRemoveItem(idx)}
                                            className="text-red-400 hover:text-red-300 text-sm px-2"
                                        >
                                            <i className="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>

                            {/* ملخص السعرات والماكروز */}
                            <div className="grid grid-cols-4 gap-2 bg-gray-900/80 p-4 rounded-xl border border-gray-700 mb-6 text-center">
                                <div>
                                    <div className="text-xs text-gray-400">السعرات</div>
                                    <div className="text-lg font-extrabold text-amber-400">{Math.round(totals.cal)}</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-400">بروتين</div>
                                    <div className="text-lg font-bold text-blue-400">{totals.protein.toFixed(1)}g</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-400">كارب</div>
                                    <div className="text-lg font-bold text-emerald-400">{totals.carbs.toFixed(1)}g</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-400">دهون</div>
                                    <div className="text-lg font-bold text-rose-400">{totals.fat.toFixed(1)}g</div>
                                </div>
                            </div>

                            <button 
                                onClick={() => setIsSaved(true)}
                                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition duration-200"
                            >
                                <i className="fa-solid fa-floppy-disk ml-2"></i>
                                تأكيد وحفظ الوجبة
                            </button>

                            {isSaved && (
                                <div className="mt-3 p-3 bg-emerald-500/20 text-emerald-300 rounded-lg text-center text-sm border border-emerald-500/40">
                                    ✅ تم تسجيل الوجبة بنجاح في قاعدة البيانات!
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<DishScannerApp />);
    </script>
</body>
</html>
